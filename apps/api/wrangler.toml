name = "sjelle-api"
main = "src/index.ts"
compatibility_date = "2026-10-20"
workers_dev = true

[observability]
enabled = true

[env.staging]
name = "sjelle-api-staging"
workers_dev = true

[env.production]
name = "sjelle-api-production"
