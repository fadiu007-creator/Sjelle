name: Deploy Sjelle to Cloudflare

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare Worker environment
        type: choice
        required: true
        options:
          - staging
          - production
      worker_url:
        description: Exact HTTPS URL of the deployed environment Worker (without trailing slash)
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - name: Check customer and portal JavaScript syntax
        run: |
          node --check ../customer/app.js
          node --check ../customer/app.js
          node --check ../customer/driver/driver.js
          node --check ../customer/merchant/merchant.js
          node --check ../customer/admin/admin.js
      - name: Verify Cloudflare credentials are configured
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Validate Wrangler bundle before deployment
        run: npx wrangler deploy --dry-run --outdir /tmp/sjelle-worker-dry-run --env "${{ inputs.environment }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker and customer assets
        run: npx wrangler deploy --env "${{ inputs.environment }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify deployed Worker health and readiness
        env:
          WORKER_URL: ${{ inputs.worker_url }}
        run: |
          case "$WORKER_URL" in
            https://*) ;;
            *) echo "worker_url must be an HTTPS URL"; exit 1 ;;
          esac
          case "$WORKER_URL" in
            */) echo "worker_url must not end with a slash"; exit 1 ;;
          esac
          curl --fail --silent --show-error --max-time 20 "$WORKER_URL/" -o /tmp/sjelle-home.html
          grep -qi "Sjelle" /tmp/sjelle-home.html || { echo "Customer homepage did not contain expected Sjelle app marker"; exit 1; }
          for path in driver/ merchant/ admin/; do
            curl --fail --silent --show-error --max-time 20 "$WORKER_URL/$path" -o /dev/null
          done
          curl --fail --silent --show-error --max-time 20 "$WORKER_URL/api/v1/health" -o /tmp/sjelle-health.json
          node -e 'const x=require("/tmp/sjelle-health.json"); if(x.ok!==true || x.service!=="sjelle-api") process.exit(1); console.log("Health endpoint OK")'
          curl --fail --silent --show-error --max-time 20 "$WORKER_URL/api/v1/cities" -o /tmp/sjelle-cities.json
          node -e 'const x=require("/tmp/sjelle-cities.json"); if(!Array.isArray(x.data)) { console.error(JSON.stringify(x)); process.exit(1); } console.log("City discovery endpoint OK")'
          curl --fail --silent --show-error --max-time 20 "$WORKER_URL/api/v1/ready" -o /tmp/sjelle-ready.json
          node -e 'const x=require("/tmp/sjelle-ready.json"); if(x.ok!==true || x.database!=="reachable" || x.providers?.routing!=="configured" || x.providers?.geocoding!=="configured") { console.error(JSON.stringify(x)); process.exit(1); } console.log("Readiness, database, routing and geocoding configuration OK")'
