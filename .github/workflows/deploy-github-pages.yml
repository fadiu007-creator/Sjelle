name: Deploy Sjelle to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/customer/**"
      - "apps/api/**"
      - "supabase/functions/**"
      - ".github/workflows/deploy-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test server-side API source
        working-directory: apps/api
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm test
          npm run typecheck
      - name: Check portal JavaScript syntax
        run: |
          node --check apps/customer/app.js
          node --check apps/customer/driver/driver.js
          node --check apps/customer/merchant/merchant.js
          node --check apps/customer/admin/admin.js
      - name: Smoke test deployed Supabase API
        run: |
          API_BASE="https://saavqlbwffrwxingbnri.supabase.co/functions/v1/sjelle-api/api/v1"
          HEALTH_STATUS=$(curl --silent --show-error --max-time 30 "$API_BASE/health" -o /tmp/sjelle-health.json -w "%{http_code}")
          echo "Health endpoint HTTP status: $HEALTH_STATUS"
          cat /tmp/sjelle-health.json
          test "$HEALTH_STATUS" = "200"
          node -e 'const x=require("/tmp/sjelle-health.json"); if(x.ok!==true || x.service!=="sjelle-api") { console.error(JSON.stringify(x)); process.exit(1); } console.log("Supabase API health OK")'
          CITY_STATUS=$(curl --silent --show-error --max-time 30 "$API_BASE/cities" -o /tmp/sjelle-cities.json -w "%{http_code}")
          echo "City endpoint HTTP status: $CITY_STATUS"
          cat /tmp/sjelle-cities.json
          test "$CITY_STATUS" = "200"
          node -e 'const x=require("/tmp/sjelle-cities.json"); if(!Array.isArray(x.data) || x.data.length!==6) { console.error(JSON.stringify(x)); process.exit(1); } if(x.data.some(c=>c.active || c.rides_enabled || c.food_enabled)) { console.error("Safety check failed: a launch city is enabled"); process.exit(1); } console.log("City API OK; all six launch cities remain disabled")'
          for CITY in $(node -e 'const x=require("/tmp/sjelle-cities.json"); process.stdout.write(x.data.map(c=>c.slug).join(" "))'); do
            STATUS=$(curl --silent --show-error --max-time 30 "$API_BASE/restaurants?city=$CITY" -o "/tmp/sjelle-restaurants-$CITY.json" -w "%{http_code}")
            test "$STATUS" = "200"
            CITY="$CITY" node -e 'const x=require(process.argv[1]); if(x.meta?.city!==process.env.CITY || x.meta?.service_available!==false || !Array.isArray(x.data) || x.data.length!==0) { console.error(JSON.stringify(x)); process.exit(1); }' "/tmp/sjelle-restaurants-$CITY.json"
          done
          echo "All six disabled cities correctly block restaurant listings"
          curl --fail --silent --show-error --max-time 30 "$API_BASE/ready" -o /tmp/sjelle-ready.json
          node -e 'const x=require("/tmp/sjelle-ready.json"); if(x.ok!==true || x.database!=="reachable" || x.providers?.routing!=="configured" || x.providers?.geocoding!=="configured") { console.error(JSON.stringify(x)); process.exit(1); } console.log("Supabase readiness and routing/geocoding configuration OK")'
          PREFLIGHT_STATUS=$(curl --silent --show-error --max-time 30 -X OPTIONS "$API_BASE/me" -H "Origin: https://fadiu007-creator.github.io" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: authorization,content-type" -D /tmp/sjelle-cors-headers.txt -o /dev/null -w "%{http_code}")
          test "$PREFLIGHT_STATUS" = "204"
          grep -Fqi "access-control-allow-origin: https://fadiu007-creator.github.io" /tmp/sjelle-cors-headers.txt
          echo "GitHub Pages CORS preflight OK"
          AUTH_STATUS=$(curl --silent --show-error --max-time 30 "$API_BASE/me" -o /tmp/sjelle-auth.json -w "%{http_code}")
          test "$AUTH_STATUS" = "401"
          node -e 'const x=require("/tmp/sjelle-auth.json"); if(x.error?.code!=="UNAUTHENTICATED") { console.error(JSON.stringify(x)); process.exit(1); } console.log("Protected profile endpoint rejects unauthenticated access")'
          for ROUTE in "/rides" "/food-orders" "/driver/offers" "/admin/cities"; do
            METHOD="GET"
            case "$ROUTE" in "/rides"|"/food-orders") METHOD="POST";; esac
            STATUS=$(curl --silent --show-error --max-time 30 -X "$METHOD" "$API_BASE$ROUTE" -H "content-type: application/json" --data '{}' -o /tmp/sjelle-protected.json -w "%{http_code}")
            test "$STATUS" = "401"
            node -e 'const x=require("/tmp/sjelle-protected.json"); if(x.error?.code!=="UNAUTHENTICATED") { console.error(JSON.stringify(x)); process.exit(1); }'
          done
          echo "Ride, food-order, driver, and admin APIs reject unauthenticated requests"
      - name: Prepare project Pages path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil
          source = Path("apps/customer")
          target = Path("_site")
          if target.exists():
              shutil.rmtree(target)
          shutil.copytree(source, target, ignore=shutil.ignore_patterns("_headers"))
          # GitHub project Pages is hosted below /Sjelle/, unlike a domain root.
          for page in target.rglob("*.html"):
              text = page.read_text(encoding="utf-8")
              text = re.sub(r"""(["'])/(?!/)""", r"\1/Sjelle/", text)
              page.write_text(text, encoding="utf-8")
          (target / ".nojekyll").touch()
          index = target / "index.html"
          if not index.exists():
              raise SystemExit("Build failed: customer index.html is missing")
          # Guard against regressions in both single- and double-quoted root-relative links.
          sample = '<a href="/driver/">Driver</a><script src="/app.js"></script><a href=\'/merchant/\'>Merchant</a>'
          rewritten = re.sub(r"""(["'])/(?!/)""", r"\1/Sjelle/", sample)
          if '/Sjelle/driver/' not in rewritten or '/Sjelle/app.js' not in rewritten or '/Sjelle/merchant/' not in rewritten:
              raise SystemExit(f"GitHub Pages root-path rewrite failed: {rewritten}")
          print(f"Prepared {sum(1 for p in target.rglob('*') if p.is_file())} static files; project-path rewriting passed")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
