name: Sjelle API checks

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "supabase/migrations/**"
      - ".github/workflows/sjelle-api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "supabase/migrations/**"
      - ".github/workflows/sjelle-api.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Run API tests
        run: npm test
      - name: Type-check API
        run: npm run typecheck
