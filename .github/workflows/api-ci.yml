name: API CI

on:
  push:
    paths:
      - "apps/api/**"
      - "apps/customer/**"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/customer/**"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - name: Guard API and deployed Edge Function parity
        working-directory: .
        run: node scripts/check-critical-api-parity.mjs
      - name: Check customer and portal JavaScript syntax
        run: |
          node --check ../customer/app.js
          node --check ../customer/driver/driver.js
          node --check ../customer/merchant/merchant.js
          node --check ../customer/admin/admin.js
      - name: Validate deployed Supabase Edge Function source
        working-directory: .
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          "$HOME/.deno/bin/deno" check supabase/functions/sjelle-api/index.ts
