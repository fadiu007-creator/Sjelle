name: API CI

on:
  push:
    paths:
      - "apps/api/**"
      - "apps/customer/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/customer/**"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - name: Check customer and portal JavaScript syntax
        run: |
          node --check ../customer/app.js
          node --check ../customer/driver/driver.js
          node --check ../customer/merchant/merchant.js
          node --check ../customer/admin/admin.js
      - name: Validate Worker bundle and Wrangler configuration
        run: npx wrangler deploy --dry-run --outdir /tmp/sjelle-worker-dry-run
